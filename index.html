<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="description" content="KAZE GP — a 3D formula sprint through Japan: city, forest, mountain and dunes.">
<title>KAZE GP — Japan Sprint</title>
<style>
:root{--glass:rgba(12,14,24,.6);--line:rgba(255,255,255,.16);--red:#ff3355;--cyan:#19d3ff;--it:italic 900 1em/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d14;color:#fff;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

#load{position:fixed;inset:0;display:grid;place-items:center;font:var(--it);font-size:20px;letter-spacing:.2em}
#fx{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at 50% 55%,transparent 42%,rgba(110,215,255,.3) 100%)}
body.boosting #fx{opacity:1}

/* menu */
#title{position:fixed;top:max(20px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.6)}
#title h1{margin:0;font:var(--it);font-size:clamp(44px,13vw,76px);letter-spacing:-.02em}
#title h1 span{color:var(--red);margin-left:.16em}
#title p{margin:8px 0 0;font-size:12px;letter-spacing:.34em;opacity:.9}
.card{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 24px));padding:14px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;gap:12px}
.cars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cars button{display:grid;gap:5px;padding:8px 4px 9px;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid transparent;text-align:center}
.cars button.on{border-color:#fff;background:rgba(255,255,255,.16)}
.cars i{display:block;height:26px;border-radius:8px}
.cars b{font-size:11px;letter-spacing:.03em;white-space:nowrap}
.cars span{font-size:10px;font-weight:500;opacity:.7}
.stats{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:7px 10px;align-items:center;font-size:10px;letter-spacing:.1em}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),#fff);transition:width .25s}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:rgba(255,255,255,.09)}
.seg button{padding:9px 0;border-radius:9px;font-size:12px;letter-spacing:.05em;opacity:.75}
.seg button.on{background:#fff;color:#111;opacity:1}
.go{padding:15px;border-radius:14px;background:linear-gradient(180deg,#ff4d6a,#e3173c);font:var(--it);font-size:18px;letter-spacing:.08em;box-shadow:0 8px 24px rgba(227,23,60,.45)}
.go:active{transform:scale(.98)}
.ghost{padding:12px;border-radius:14px;border:1px solid var(--line);font-size:13px;letter-spacing:.06em}
.keys{margin:0;text-align:center;font-size:11px;font-weight:500;opacity:.65}
.res{display:flex;align-items:baseline;justify-content:center;gap:12px}
.res b{font:var(--it);font-size:64px}
.res span{font-size:16px;letter-spacing:.14em}
.resT{text-align:center;font:var(--it);font-size:20px;font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}

/* in-race HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}
#hud button,#steer{pointer-events:auto}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pill{padding:7px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font:var(--it);font-size:18px;min-width:66px;text-align:center;font-variant-numeric:tabular-nums}
.pos b{font-size:24px}
.pos i{font-size:13px;font-style:normal;opacity:.7;margin-left:1px}
.mid{text-align:center}
#zone{font-size:11px;letter-spacing:.22em;margin-bottom:6px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.side{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 54px);display:grid;gap:8px}
.side button{width:44px;height:44px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:11px;letter-spacing:.05em}
#count{position:absolute;left:0;right:0;top:28%;text-align:center;font:var(--it);font-size:104px;text-shadow:0 6px 30px rgba(0,0,0,.55)}
#toast{position:absolute;left:0;right:0;top:19%;text-align:center;font:var(--it);font-size:22px;letter-spacing:.2em;opacity:0;transition:opacity .4s;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#toast.show{opacity:1}
.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.pad{display:flex;gap:10px;justify-self:start;touch-action:none}
.pad span,.acts button{display:grid;place-items:center;border-radius:50%;background:var(--glass);border:1.5px solid var(--line)}
.pad span{width:70px;height:70px;font-size:24px}
.acts{justify-self:end;display:grid;justify-items:end;gap:10px}
.acts button{font-size:11px;letter-spacing:.08em;touch-action:none}
#tBoost{width:64px;height:64px;border-color:rgba(25,211,255,.7);color:#bff2ff}
#tDrift{width:78px;height:78px}
.pad span.on,.acts button.on{background:rgba(255,255,255,.4)}
.gauge{text-align:center;padding-bottom:2px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.gauge b{display:block;font:var(--it);font-size:46px;font-variant-numeric:tabular-nums}
.gauge>i{font-style:normal;font-size:10px;letter-spacing:.3em;opacity:.85}
.boost{margin:8px auto 0;width:112px;height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.boost i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#7c8794,#aab4c0)}
.boost.ready i{background:linear-gradient(90deg,var(--cyan),#fff)}

@media (pointer:coarse){.keys{display:none}}
@media (hover:hover) and (pointer:fine){.pad,.acts{visibility:hidden}}
@media (orientation:landscape) and (max-height:520px){
  .card{left:max(12px,env(safe-area-inset-left));transform:none;width:330px;gap:8px;padding:10px}
  #title{left:auto;right:6%;top:14px}
  #title h1{font-size:44px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>
<div id="load">LOADING</div>

<div id="title" hidden><h1>KAZE<span>GP</span></h1><p>JAPAN SPRINT · 7.2 KM</p></div>

<section id="menu" class="card" hidden>
  <div id="cars" class="cars"></div>
  <div id="stats" class="stats"></div>
  <div id="views" class="seg">
    <button data-v="tpp" class="on">Chase view</button>
    <button data-v="fpp">Cockpit view</button>
  </div>
  <button id="start" class="go">START RACE</button>
  <p class="keys">← → steer · ↓ brake · Space drift · Shift boost · C camera</p>
</section>

<section id="finish" class="card" hidden>
  <div class="res"><b id="fPos">1st</b><span id="fMsg">VICTORY</span></div>
  <div class="resT" id="fTime">0:00.0</div>
  <button id="again" class="go">RACE AGAIN</button>
  <button id="change" class="ghost">Change car</button>
</section>

<div id="hud" hidden>
  <div class="top">
    <div class="pill pos"><b id="pos">6</b><i>/6</i></div>
    <div class="mid"><div id="zone">NEO CITY</div><div class="prog"><i id="prog"></i></div></div>
    <div class="pill" id="time">0:00.0</div>
  </div>
  <div class="side">
    <button id="camBtn" aria-label="Switch camera">CAM</button>
    <button id="muteBtn" aria-label="Sound on or off">SND</button>
  </div>
  <div id="count"></div>
  <div id="toast"></div>
  <div class="bottom">
    <div id="steer" class="pad"><span>◀</span><span>▶</span></div>
    <div class="gauge"><b id="spd">0</b><i>KM/H</i><div class="boost" id="boostBar"><i id="boost"></i></div></div>
    <div class="acts"><button id="tBoost">BOOST</button><button id="tDrift">DRIFT</button></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
